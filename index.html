<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <section class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">
        <div class="row text-center pomodoro-container justify-content-center align-items-center">
            <div class="col-12">
                <h1 class="display-1 text-white"><span class="text-danger">Pomodoro</span> Timer</h1>
            </div>
            <div class="row justify-content-center align-items-center mt-3">
                <h1 class="text-white mb-5">Configuration</h1>
                <div class="col-12 col-md-4 d-flex justify-content-center justify-content-md-end">
                    <h3 class="text-white">Study Time: </h3>
                    <input type="text" class="form-control input-study text-center" id="inputStudy" value="25">;
                </div>
                <div class="col-12 col-md-4 d-flex justify-content-center justify-content-md-start">
                    <h3 class="text-white">Break Time: </h3>
                    <input type="text" class="form-control  input-break text-center" id="inputBreak" value="10">
                </div>
            </div>
            <div class="state text-white" id="stateDisplay">Paused</div>
            <div class="col-12">
                <div id="timerDisplay" class="timerDisplay">25:00</div>
            </div>
            <div class="col-12 col-md-4 mt-5 d-flex justify-content-center justify-content-md-end">
                <button class="card border-4 rounded-4 shadow p-4" id="startButton">Start</button>
            </div>
            <div class="col-12 col-md-4 mt-5 d-flex justify-content-center">
                <button class="card border-4 rounded-4 shadow p-4" id="pauseButton">Pause</button>
            </div>
            <div class="col-12 col-md-4 mt-5 d-flex justify-content-center justify-content-md-start">
                <button class="card border-4 rounded-4 shadow p-4" id="resetButton">Reset</button>
            </div>
        </div>
    </section>
    <audio class="container-alarm text-white" id="alarmSound" src="" preload="auto">audio</audio>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
